name: Ameen iOS
on:
  workflow_dispatch:
  push:
    branches: ['feature/ameen-ios']
    paths: ['Ameen/**', '.github/workflows/ameen-ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify ledger and Arabic assistant
        run: |
          swiftc Ameen/App/Ledger.swift Ameen/App/Assistant.swift Ameen/Tests/main.swift -o "$RUNNER_TEMP/ledger-tests"
          "$RUNNER_TEMP/ledger-tests"
      - name: Build iPhone application
        run: |
          xcodebuild -project Ameen/Ameen.xcodeproj -scheme Ameen -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ameen-build" CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/ameen-build/Build/Products/Release-iphoneos/Ameen.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Ameen-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Ameen-iPhone-unsigned
          path: Ameen-unsigned.ipa
          if-no-files-found: error
      - name: Launch Ameen on an iPhone simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for key,ds in json.load(sys.stdin)["devices"].items() if ".iOS-" in key for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device" || xcrun simctl bootstatus "$device" -b
          xcodebuild -project Ameen/Ameen.xcodeproj -scheme Ameen -configuration Debug -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/ameen-sim" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/ameen-sim/Build/Products/Debug-iphonesimulator/Ameen.app"
          xcrun simctl launch "$device" com.ameenledger.ios -AppleLanguages '(ar)' -AppleLocale ar_SA
          sleep 3
          xcrun simctl spawn "$device" launchctl list | grep 'com.ameenledger.ios' | awk '$1 ~ /^[0-9]+$/ { found=1 } END { exit !found }'
