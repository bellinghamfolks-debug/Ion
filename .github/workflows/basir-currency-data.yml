# Currency reader data: find and audit the Saudi riyal image sources.
# Runs where the internet is reachable and commits a report of every source,
# its contents and its licence, before anything is used for training.

name: Basir currency data

on:
  push:
    branches: ["claude/basir-currency"]
    paths:
      - "BasirConvertiOS/tools/currency/*.py"
      - ".github/workflows/basir-currency-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basir-currency-data
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the 6.75 GB dataset
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - run: pip install --quiet pillow
      - name: Wikimedia Commons, current series
        run: python3 BasirConvertiOS/tools/currency/discover_sources.py BasirConvertiOS/tools/currency/reports/commons.json commons
      - name: Saudi Currency Dataset (CC BY 4.0)
        run: python3 BasirConvertiOS/tools/currency/audit_dataset.py "$RUNNER_TEMP/currency" BasirConvertiOS/tools/currency/reports
      - name: Commit the reports
        run: |
          git config user.name "basir-ci"
          git config user.email "basir-ci@users.noreply.github.com"
          git add BasirConvertiOS/tools/currency/reports
          git diff --cached --quiet || git commit -m "Currency data reports [skip ci]"
          git pull --rebase --quiet && git push
