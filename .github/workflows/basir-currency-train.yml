# Currency reader: build the training images (Linux), train and measure the
# classifier with Create ML (macOS), then commit the model and its measured
# accuracy to the branch.

name: Basir currency train

on:
  push:
    branches: ["claude/basir-currency"]
    paths:
      - "BasirConvertiOS/tools/currency/prepare_dataset.py"
      - "BasirConvertiOS/tools/currency/prepare_v2.py"
      - "BasirConvertiOS/tools/currency/references.json"
      - "BasirConvertiOS/tools/currency/train_classifier.swift"
      - ".github/workflows/basir-currency-train.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basir-currency-train
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the 6.75 GB dataset
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - run: pip install --quiet pillow
      - name: Build training and test images
        run: python3 BasirConvertiOS/tools/currency/prepare_v2.py "$RUNNER_TEMP/raw" "$RUNNER_TEMP/riyal"
      - name: Pack
        run: |
          rm -rf "$RUNNER_TEMP/raw"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/riyal.tar" riyal
          ls -la "$RUNNER_TEMP/riyal.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: riyal-dataset
          path: ${{ runner.temp }}/riyal.tar
          retention-days: 3

  train:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: riyal-dataset
          path: ${{ runner.temp }}
      - name: Unpack
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/riyal.tar" && cat "$RUNNER_TEMP/riyal/stats.json"
      - name: Train and measure
        run: swift BasirConvertiOS/tools/currency/train_classifier.swift "$RUNNER_TEMP/riyal" "$RUNNER_TEMP/model"
      - name: Commit the model and its measurements
        run: |
          mkdir -p BasirConvertiOS/BasirConvert/Resources/Currency BasirConvertiOS/tools/currency/reports
          cp "$RUNNER_TEMP/model/RiyalClassifier.mlmodel" BasirConvertiOS/BasirConvert/Resources/Currency/
          cp "$RUNNER_TEMP/model/metrics.json" BasirConvertiOS/tools/currency/reports/model_metrics.json
          cp "$RUNNER_TEMP/riyal/stats.json" BasirConvertiOS/tools/currency/reports/training_images.json
          ls -la BasirConvertiOS/BasirConvert/Resources/Currency
          git config user.name "basir-ci"
          git config user.email "basir-ci@users.noreply.github.com"
          git add BasirConvertiOS/BasirConvert/Resources/Currency BasirConvertiOS/tools/currency/reports
          git diff --cached --quiet || git commit -m "Currency reader model and measurements [skip ci]"
          git pull --rebase --quiet && git push
