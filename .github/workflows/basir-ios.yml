# Basir Convert iOS — GitHub Actions build + unit tests.
#
# Generates the Xcode project with XcodeGen, runs the static source checks,
# then builds and tests on a freshly created iPhone simulator whose runtime
# matches the active SDK. No secrets are used: the client token stays empty,
# so the app compiles and the tests run without contacting the server.
# Signed or unsigned device builds remain in Codemagic (codemagic.yaml).

name: Basir iOS

on:
  push:
    branches: ["claude/basir-*"]
    paths:
      - "BasirConvertiOS/**"
      - ".github/workflows/basir-ios.yml"
  workflow_dispatch:

concurrency:
  group: basir-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: BasirConvertiOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify checked-in source
        run: python3 tools/verify_project.py . --source-only

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and verify Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          chmod +x scripts/verify_project.sh
          scripts/verify_project.sh

      - name: Create a fresh simulator on the SDK runtime
        id: sim
        run: |
          set -euo pipefail
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Simulator SDK: $SDK_VERSION"
          read -r RUNTIME_ID DEVICE_TYPE <<< "$(xcrun simctl list runtimes available -j | SDK_VERSION="$SDK_VERSION" python3 -c '
          import json, os, re, sys
          sdk = os.environ["SDK_VERSION"]
          runtimes = [r for r in json.load(sys.stdin)["runtimes"]
                      if r.get("isAvailable")
                      and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          exact = [r for r in runtimes if r["version"] == sdk or r["version"].startswith(sdk + ".")]
          major = [r for r in runtimes if r["version"].split(".")[0] == sdk.split(".")[0]]
          runtime = (exact or major or runtimes)[-1]
          phones = [d for d in runtime.get("supportedDeviceTypes", [])
                    if d.get("productFamily") == "iPhone" or d["name"].startswith("iPhone")]
          plain = [d for d in phones if not re.search(r"Plus|Max|SE|mini|Air|\d+e\b", d["name"])]
          device = (plain or phones)[-1]
          print(runtime["identifier"], device["identifier"])
          ')"
          UDID="$(xcrun simctl create "Basir CI" "$DEVICE_TYPE" "$RUNTIME_ID")"
          echo "Created $UDID ($DEVICE_TYPE on $RUNTIME_ID)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set +e
          mkdir -p build
          UDID="${{ steps.sim.outputs.udid }}"
          for attempt in 1 2; do
            xcodebuild test \
              -project BasirConvert.xcodeproj \
              -scheme BasirConvert \
              -destination "id=$UDID" \
              -configuration Debug \
              -derivedDataPath build \
              -resultBundlePath "build/Tests-$attempt.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO > "build/test-$attempt.log" 2>&1
            STATUS=$?
            grep -E "Test Suite .*(passed|failed)|Executed [0-9]+ test|\*\* TEST" "build/test-$attempt.log" | tail -20
            if [ $STATUS -eq 0 ]; then exit 0; fi
            if grep -q " error: " "build/test-$attempt.log"; then
              echo "::group::Compile errors"
              grep -E " error: " "build/test-$attempt.log" | sort -u | head -100
              echo "::endgroup::"
              exit 1
            fi
            echo "::group::Failures (attempt $attempt)"
            grep -E "error|failed|Fail|crash" "build/test-$attempt.log" | tail -60
            echo "::endgroup::"
            echo "Test run $attempt failed; retrying once on a rebooted simulator."
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
          done
          exit 1

      - name: Build for device (unsigned, Release)
        run: |
          set +e
          xcodebuild build \
            -project BasirConvert.xcodeproj \
            -scheme BasirConvert \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO > build/device.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            grep -E " error: " build/device.log | sort -u | head -100
            tail -30 build/device.log
            exit 1
          fi
          ls build/device/Build/Products/Release-iphoneos/BasirConvert.app/PlugIns
