name: Basir Visual direct build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - claude/file-extraction-repo-migration-hqgNY

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Transform to Visual edition
        run: python3 scripts/make_basir_visual.py

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          rm -rf build
          xcodebuild build \
            -project Basir.xcodeproj \
            -scheme Basir \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Validate and package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/Basir.app"
          test -d "$APP"
          test -f "$APP/Basir"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.basir.visual'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = 'بصير المرئي'
          lipo -info "$APP/Basir" | tee /tmp/basir-visual-arch.txt
          grep -q arm64 /tmp/basir-visual-arch.txt
          test ! -d "$APP/_CodeSignature"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP" build/Payload/Basir.app
          (cd build && zip -qry Basir-Visual-v4.4.1-build65-unsigned.ipa Payload)
          unzip -t build/Basir-Visual-v4.4.1-build65-unsigned.ipa
          shasum -a 256 build/Basir-Visual-v4.4.1-build65-unsigned.ipa > build/Basir-Visual-v4.4.1-build65-unsigned.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Basir-Visual-v4.4.1-build65-unsigned
          path: |
            ios/build/Basir-Visual-v4.4.1-build65-unsigned.ipa
            ios/build/Basir-Visual-v4.4.1-build65-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
