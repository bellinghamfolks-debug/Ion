name: Fetch My Coffee Lounge 1.5.0 XAPK

on:
  push:
    branches:
      - upload/my-coffee-lounge-1.5.0
    paths:
      - .github/workflows/fetch-my-coffee-lounge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upload/my-coffee-lounge-1.5.0

      - name: Download exact XAPK with apkeep and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81"
          OUT="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          IMAGE="ghcr.io/efforg/apkeep:stable"

          try_variant() {
            local label="$1"
            shift
            rm -rf /tmp/apkeep-out
            mkdir -p /tmp/apkeep-out
            echo "Trying apkeep variant: $label"
            docker run --rm -v "/tmp/apkeep-out:/output" "$IMAGE" \
              -a "com.delonghigroup.daedalus@1.5.0" -d apk-pure "$@" /output || return 1

            find /tmp/apkeep-out -maxdepth 1 -type f -printf '%f %s bytes\n' || true
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              actual="$(sha256sum "$f" | awk '{print $1}')"
              size="$(stat -c%s "$f")"
              echo "Candidate: $(basename "$f")"
              echo "Size: $size"
              echo "SHA-256: $actual"
              if [[ "$actual" == "$EXPECTED" ]]; then
                cp "$f" "$OUT"
                return 0
              fi
            done < <(find /tmp/apkeep-out -maxdepth 1 -type f \( -name '*.xapk' -o -name '*.apk' \) | sort)
            return 1
          }

          docker pull "$IMAGE"

          found=0
          if try_variant "arm64-v8a" -o 'acknowledge_dangers=true,arch=arm64-v8a'; then
            found=1
          elif try_variant "default architectures" -o 'acknowledge_dangers=true'; then
            found=1
          elif try_variant "arm64 plus legacy ARM" -o 'acknowledge_dangers=true,arch=arm64-v8a;armeabi-v7a;armeabi'; then
            found=1
          fi

          if [[ "$found" -ne 1 ]]; then
            echo "apkeep did not return the byte-for-byte APKPure XAPK expected."
            exit 1
          fi

          echo "$EXPECTED  $OUT" | sha256sum -c -
          test "$(stat -c%s "$OUT")" = "99992559"

      - name: Split into GitHub-safe parts
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          DIR="uploads/My-Coffee-Lounge-1.5.0"
          mkdir -p "$DIR"
          rm -f "$DIR"/My_Coffee_Lounge_1.5.0.xapk.*.part
          split -b 20M -d -a 2 "$SRC" /tmp/My_Coffee_Lounge_1.5.0.xapk.
          for f in /tmp/My_Coffee_Lounge_1.5.0.xapk.[0-9][0-9]; do
            mv "$f" "$DIR/$(basename "$f").part"
          done
          (cd "$DIR" && sha256sum My_Coffee_Lounge_1.5.0.xapk.*.part > SHA256SUMS.txt)
          cat > "$DIR/REASSEMBLE.txt" <<'EOF'
          Original file: My+Coffee+Lounge_1.5.0_APKPure.xapk
          Original size: 99992559 bytes
          Original SHA-256: 78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81

          Linux/macOS:
          cat My_Coffee_Lounge_1.5.0.xapk.*.part > My+Coffee+Lounge_1.5.0_APKPure.xapk
          sha256sum My+Coffee+Lounge_1.5.0_APKPure.xapk

          Windows PowerShell:
          $parts = Get-ChildItem 'My_Coffee_Lounge_1.5.0.xapk.*.part' | Sort-Object Name
          $out = [System.IO.File]::Create('My+Coffee+Lounge_1.5.0_APKPure.xapk')
          foreach ($p in $parts) { $bytes=[System.IO.File]::ReadAllBytes($p.FullName); $out.Write($bytes,0,$bytes.Length) }
          $out.Close()
          Get-FileHash 'My+Coffee+Lounge_1.5.0_APKPure.xapk' -Algorithm SHA256
          EOF
          ls -lh "$DIR"

      - name: Commit parts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/My-Coffee-Lounge-1.5.0
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add My Coffee Lounge 1.5.0 XAPK parts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
