name: Fetch My Coffee Lounge 1.5.0 XAPK

on:
  push:
    branches:
      - upload/my-coffee-lounge-1.5.0
    paths:
      - .github/workflows/fetch-my-coffee-lounge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upload/my-coffee-lounge-1.5.0

      - name: Fetch APKCombo 1.5.0 bundle and verify exact components
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/apkcombo /tmp/xapk-components
          mkdir -p /tmp/apkcombo /tmp/xapk-components

          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

          cat > /tmp/fetch_apkcombo.py <<'PY'
          import asyncio, os
          from playwright.async_api import async_playwright

          PAGE="https://apkcombo.com/my-coffee-lounge/com.delonghigroup.daedalus/download/apk"
          OUT="/tmp/apkcombo/bundle.xapk"

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  ctx=await browser.new_context(
                      accept_downloads=True,
                      user_agent="Mozilla/5.0 (Linux; Android 12; Pixel 6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140 Mobile Safari/537.36",
                      viewport={"width":1280,"height":900},
                      locale="en-US",
                  )
                  page=await ctx.new_page()
                  resp=await page.goto(PAGE,wait_until="domcontentloaded",timeout=120000)
                  print("APKCombo status:",resp.status if resp else None)
                  await page.wait_for_timeout(3000)

                  loc=page.locator("a[href*='/d?u=']")
                  count=await loc.count()
                  print("Signed download links:",count)
                  chosen=None
                  for idx in range(count):
                      el=loc.nth(idx)
                      text=(await el.inner_text()).strip()
                      href=await el.get_attribute("href") or ""
                      print("Candidate",idx,text[:160],href[:180])
                      if ("1.5.0" in text or "318" in text or
                          "Y29tLmRlbG9uZ2hpZ3JvdXAuZGFlZGFsdXM" in href):
                          chosen=el
                          break
                  if chosen is None and count:
                      chosen=loc.nth(0)
                  if chosen is None:
                      raise RuntimeError("No APKCombo signed XAPK link found")

                  async with page.expect_download(timeout=180000) as di:
                      await chosen.click(timeout=30000)
                  d=await di.value
                  await d.save_as(OUT)
                  print("Saved:",d.suggested_filename,os.path.getsize(OUT))
                  await browser.close()

          asyncio.run(main())
          PY

          python3 /tmp/fetch_apkcombo.py
          test -s /tmp/apkcombo/bundle.xapk

          python3 - <<'PY'
          import zipfile, hashlib, os, sys
          bundle='/tmp/apkcombo/bundle.xapk'
          expected={
            'base':'afd5256eabaf7d938825e62691188494cda5803d26fd20111ae92c18a4e3cbe2',
            'config.en':'0fbb67f6c390292cc12c8b5b3fda4d4588220a70b54d4c5b5f2389712154ddea',
            'config.fr':'ae55e4d481f25207c4c68e23731690549d1e47a8277bd9904be42b2b5c945241',
            'config.hdpi':'aa8cc2b93feffb48ddf3a06e251ebaa7b59f6c3b5b85f686e650301c6860b8f8',
            'config.arm64_v8a':'6e04a8549e0900c5193a9ec593d675a046832c680ca9795ad305c6f748b52483',
          }
          outnames={
            'base':'com.delonghigroup.daedalus.apk',
            'config.en':'config.en.apk',
            'config.fr':'config.fr.apk',
            'config.hdpi':'config.hdpi.apk',
            'config.arm64_v8a':'config.arm64_v8a.apk',
          }
          z=zipfile.ZipFile(bundle)
          got={}
          for n in z.namelist():
              if not n.lower().endswith('.apk'):
                  continue
              data=z.read(n)
              h=hashlib.sha256(data).hexdigest()
              for key,want in expected.items():
                  if h==want and key not in got:
                      got[key]=data
                      print("MATCH",key,os.path.basename(n),len(data),h)
                      break
          missing=[k for k in expected if k not in got]
          if missing:
              raise SystemExit("Missing exact components: "+", ".join(missing))
          for key,data in got.items():
              open('/tmp/xapk-components/'+outnames[key],'wb').write(data)
          print("ALL_REQUIRED_COMPONENT_HASHES_MATCH=1")
          PY

      - name: Rebuild the exact user-supplied APKPure XAPK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, shutil, struct, zipfile, zlib

          roots=['/tmp/xapk-components']
          work='/tmp/exact-components'
          shutil.rmtree(work, ignore_errors=True)
          os.makedirs(work)

          expected={
            'com.delonghigroup.daedalus.apk':'afd5256eabaf7d938825e62691188494cda5803d26fd20111ae92c18a4e3cbe2',
            'config.en.apk':'0fbb67f6c390292cc12c8b5b3fda4d4588220a70b54d4c5b5f2389712154ddea',
            'config.fr.apk':'ae55e4d481f25207c4c68e23731690549d1e47a8277bd9904be42b2b5c945241',
            'config.hdpi.apk':'aa8cc2b93feffb48ddf3a06e251ebaa7b59f6c3b5b85f686e650301c6860b8f8',
            'config.arm64_v8a.apk':'6e04a8549e0900c5193a9ec593d675a046832c680ca9795ad305c6f748b52483',
          }

          def sha(data): return hashlib.sha256(data).hexdigest()

          found={}
          for root in roots:
            for dp,_,files in os.walk(root):
              for fn in files:
                path=os.path.join(dp,fn)
                try:
                  data=open(path,'rb').read()
                except OSError:
                  continue

                for outname,h in expected.items():
                  if outname not in found and sha(data)==h:
                    open(os.path.join(work,outname),'wb').write(data)
                    found[outname]=path

                try:
                  with zipfile.ZipFile(path) as z:
                    for zi in z.infolist():
                      try:
                        data=z.read(zi.filename)
                      except Exception:
                        continue
                      for outname,h in expected.items():
                        if outname not in found and sha(data)==h:
                          open(os.path.join(work,outname),'wb').write(data)
                          found[outname]=f'{path}!{zi.filename}'
                except zipfile.BadZipFile:
                  pass

          print('Matched components:')
          for k in expected:
            print(k, '->', found.get(k,'MISSING'))
          missing=[k for k in expected if k not in found]
          if missing:
            raise SystemExit('Missing exact APK components: '+', '.join(missing))

          base=os.path.join(work,'com.delonghigroup.daedalus.apk')
          with zipfile.ZipFile(base) as z:
            icon=z.read('res/mipmap-xxxhdpi-v4/launcher_icon.png')
          if sha(icon)!='66e9b1af2fdb47b4c87f40027acd904f51c6e82c8eeaa58d3352658f3a98eac6':
            raise SystemExit('Icon mismatch')
          open(os.path.join(work,'icon.png'),'wb').write(icon)

          manifest_b64=''
          manifest=base64.b64decode(manifest_b64)
          if sha(manifest)!='1cf98380b7d2449c6227266dd276921f9f94ffc94bd4582c8330cacd5d482cb8':
            raise SystemExit('Manifest mismatch')
          open(os.path.join(work,'manifest.json'),'wb').write(manifest)

          names=[
            'com.delonghigroup.daedalus.apk',
            'icon.png',
            'config.en.apk',
            'config.fr.apk',
            'config.hdpi.apk',
            'config.arm64_v8a.apk',
            'manifest.json',
          ]
          out='/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk'
          records=[]
          with open(out,'wb') as f:
            for name in names:
              data=open(os.path.join(work,name),'rb').read()
              nb=name.encode('utf-8')
              crc=zlib.crc32(data)&0xffffffff
              size=len(data)
              offset=f.tell()
              f.write(struct.pack('<IHHHHHIIIHH',0x04034b50,20,8,0,0,0,0,0,0,len(nb),0))
              f.write(nb); f.write(data)
              f.write(struct.pack('<IIII',0x08074b50,crc,size,size))
              records.append((name,crc,size,offset))
            cstart=f.tell()
            comment=b'ApkPure.com'
            for name,crc,size,offset in records:
              nb=name.encode('utf-8')
              f.write(struct.pack('<IHHHHHHIIIHHHHHII',0x02014b50,20,20,8,0,0,0,crc,size,size,len(nb),0,len(comment),0,0,0,offset))
              f.write(nb); f.write(comment)
            csize=f.tell()-cstart
            f.write(struct.pack('<IHHHHIIH',0x06054b50,0,0,len(records),len(records),csize,cstart,0))

          actual=hashlib.sha256(open(out,'rb').read()).hexdigest()
          size=os.path.getsize(out)
          print('Rebuilt size:',size)
          print('Rebuilt SHA-256:',actual)
          if size!=99992559 or actual!='78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81':
            raise SystemExit('Rebuilt XAPK is not byte-for-byte identical')
          print('BYTE_FOR_BYTE_MATCH=1')
          PY

      - name: Split into GitHub-safe parts
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          DIR="uploads/My-Coffee-Lounge-1.5.0"
          mkdir -p "$DIR"
          rm -f "$DIR"/My_Coffee_Lounge_1.5.0.xapk.*.part
          split -b 20M -d -a 2 "$SRC" /tmp/My_Coffee_Lounge_1.5.0.xapk.
          for f in /tmp/My_Coffee_Lounge_1.5.0.xapk.[0-9][0-9]; do
            mv "$f" "$DIR/$(basename "$f").part"
          done
          (cd "$DIR" && sha256sum My_Coffee_Lounge_1.5.0.xapk.*.part > SHA256SUMS.txt)
          cat > "$DIR/REASSEMBLE.txt" <<'EOF'
          Original file: My+Coffee+Lounge_1.5.0_APKPure.xapk
          Original size: 99992559 bytes
          Original SHA-256: 78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81

          Linux/macOS:
          cat My_Coffee_Lounge_1.5.0.xapk.*.part > My+Coffee+Lounge_1.5.0_APKPure.xapk
          sha256sum My+Coffee+Lounge_1.5.0_APKPure.xapk
          EOF

      - name: Commit parts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/My-Coffee-Lounge-1.5.0
          git commit -m "Add My Coffee Lounge 1.5.0 XAPK parts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
