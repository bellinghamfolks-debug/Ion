name: Fetch My Coffee Lounge 1.5.0 XAPK

on:
  push:
    branches:
      - upload/my-coffee-lounge-1.5.0
    paths:
      - .github/workflows/fetch-my-coffee-lounge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upload/my-coffee-lounge-1.5.0

      - name: Download exact APKPure XAPK in a browser and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81"
          OUT="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"

          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

          cat > /tmp/fetch_apkpure.py <<'PY'
          import asyncio, os, re
          from playwright.async_api import async_playwright

          PAGE = "https://apkpure.net/my-coffee-lounge/com.delonghigroup.daedalus/download/1.5.0"
          OUT = "/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=["--disable-blink-features=AutomationControlled", "--no-sandbox"]
                  )
                  context = await browser.new_context(
                      accept_downloads=True,
                      user_agent="Mozilla/5.0 (Linux; Android 12; Pixel 6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36",
                      viewport={"width": 1280, "height": 900},
                      locale="en-US"
                  )
                  page = await context.new_page()
                  print("Opening APKPure download page...")
                  resp = await page.goto(PAGE, wait_until="domcontentloaded", timeout=120000)
                  print("Page status:", resp.status if resp else None)
                  await page.wait_for_timeout(8000)
                  print("Page title:", await page.title())

                  hrefs = await page.locator("a").evaluate_all(
                      """els => els.map(a => a.href).filter(h => h && h.includes('d.apkpure.com/b/XAPK/'))"""
                  )
                  print("Direct XAPK links found:", len(hrefs))
                  for h in hrefs[:20]:
                      print("HREF", h)

                  candidates = [h for h in hrefs if "com.delonghigroup.daedalus" in h and ("versionCode=318" in h or "version=latest" in h)]
                  if not candidates:
                      html = await page.content()
                      open("/tmp/apkpure-page.html","w",encoding="utf-8").write(html)
                      raise RuntimeError("No matching XAPK link found in rendered APKPure page")

                  # Navigate in the same browser context so any anti-bot cookies/session are retained.
                  for idx, url in enumerate(candidates):
                      print(f"Trying browser download candidate #{idx+1}")
                      dl_page = await context.new_page()
                      try:
                          async with dl_page.expect_download(timeout=180000) as info:
                              await dl_page.goto(url, wait_until="commit", timeout=180000)
                          download = await info.value
                          await download.save_as(OUT)
                          print("Saved browser download:", download.suggested_filename)
                          await dl_page.close()
                          await browser.close()
                          return
                      except Exception as exc:
                          print("Candidate failed:", repr(exc))
                          await dl_page.close()

                  raise RuntimeError("Browser could not download any APKPure candidate")
          asyncio.run(main())
          PY

          python3 /tmp/fetch_apkpure.py

          echo "Downloaded size: $(stat -c%s "$OUT") bytes"
          ACTUAL="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "SHA-256: $ACTUAL"
          test "$(stat -c%s "$OUT")" = "99992559"
          test "$ACTUAL" = "$EXPECTED"
          echo "Exact byte-for-byte match confirmed."

      - name: Split into GitHub-safe parts
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          DIR="uploads/My-Coffee-Lounge-1.5.0"
          mkdir -p "$DIR"
          rm -f "$DIR"/My_Coffee_Lounge_1.5.0.xapk.*.part
          split -b 20M -d -a 2 "$SRC" /tmp/My_Coffee_Lounge_1.5.0.xapk.
          for f in /tmp/My_Coffee_Lounge_1.5.0.xapk.[0-9][0-9]; do
            mv "$f" "$DIR/$(basename "$f").part"
          done
          (cd "$DIR" && sha256sum My_Coffee_Lounge_1.5.0.xapk.*.part > SHA256SUMS.txt)
          cat > "$DIR/REASSEMBLE.txt" <<'EOF'
          Original file: My+Coffee+Lounge_1.5.0_APKPure.xapk
          Original size: 99992559 bytes
          Original SHA-256: 78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81

          Linux/macOS:
          cat My_Coffee_Lounge_1.5.0.xapk.*.part > My+Coffee+Lounge_1.5.0_APKPure.xapk
          sha256sum My+Coffee+Lounge_1.5.0_APKPure.xapk

          Windows PowerShell:
          $parts = Get-ChildItem 'My_Coffee_Lounge_1.5.0.xapk.*.part' | Sort-Object Name
          $out = [System.IO.File]::Create('My+Coffee+Lounge_1.5.0_APKPure.xapk')
          foreach ($p in $parts) { $bytes=[System.IO.File]::ReadAllBytes($p.FullName); $out.Write($bytes,0,$bytes.Length) }
          $out.Close()
          Get-FileHash 'My+Coffee+Lounge_1.5.0_APKPure.xapk' -Algorithm SHA256
          EOF
          ls -lh "$DIR"

      - name: Commit parts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/My-Coffee-Lounge-1.5.0
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add My Coffee Lounge 1.5.0 XAPK parts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
