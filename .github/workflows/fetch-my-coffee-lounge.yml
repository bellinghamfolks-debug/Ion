name: Fetch My Coffee Lounge 1.5.0 XAPK

on:
  push:
    branches:
      - upload/my-coffee-lounge-1.5.0
    paths:
      - .github/workflows/fetch-my-coffee-lounge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upload/my-coffee-lounge-1.5.0

      - name: Download exact XAPK with apkeep and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81"
          OUT="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          PKG="com.delonghigroup.daedalus@1.5.0"

          mkdir -p /tmp/apkeep1 /tmp/apkeep2

          echo "Pulling current apkeep edge image..."
          docker pull ghcr.io/efforg/apkeep:edge

          echo "Attempt 1: version 1.5.0, arm64-v8a"
          docker run --rm -v /tmp/apkeep1:/output ghcr.io/efforg/apkeep:edge \
            -a "$PKG" -d apk-pure -o 'arch=arm64-v8a' /output || true

          echo "Attempt 2: version 1.5.0, APKPure default architecture set"
          docker run --rm -v /tmp/apkeep2:/output ghcr.io/efforg/apkeep:edge \
            -a "$PKG" -d apk-pure /output || true

          echo "Downloaded candidates:"
          find /tmp/apkeep1 /tmp/apkeep2 -maxdepth 2 -type f -printf '%p %s bytes\n' || true

          found=0
          while IFS= read -r -d '' f; do
            actual="$(sha256sum "$f" | awk '{print $1}')"
            size="$(stat -c%s "$f")"
            echo "Candidate: $f"
            echo "Size: $size"
            echo "SHA-256: $actual"
            if [[ "$actual" == "$EXPECTED" ]]; then
              cp "$f" "$OUT"
              found=1
              break
            fi
          done < <(find /tmp/apkeep1 /tmp/apkeep2 -type f -print0)

          if [[ "$found" -ne 1 ]]; then
            echo "No byte-for-byte match found. Nothing will be committed."
            exit 1
          fi

          echo "$EXPECTED  $OUT" | sha256sum -c -
          test "$(stat -c%s "$OUT")" = "99992559"

      - name: Rebuild exact APKPure XAPK byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          EXPECTED="78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81"

          python3 - <<'PY'
          import base64, hashlib, os, struct, zipfile, zlib

          root='/tmp/xapk-components'
          out='/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk'

          # APKPure's icon is exactly this image embedded in the base APK.
          with zipfile.ZipFile(os.path.join(root,'com.delonghigroup.daedalus.apk')) as z:
              icon=z.read('res/mipmap-xxxhdpi-v4/launcher_icon.png')
          open(os.path.join(root,'icon.png'),'wb').write(icon)

          # Exact manifest.json bytes from the user-supplied APKPure XAPK.
          manifest_b64=''
          open(os.path.join(root,'manifest.json'),'wb').write(base64.b64decode(manifest_b64))

          names=[
              'com.delonghigroup.daedalus.apk',
              'icon.png',
              'config.en.apk',
              'config.fr.apk',
              'config.hdpi.apk',
              'config.arm64_v8a.apk',
              'manifest.json',
          ]
          records=[]
          with open(out,'wb') as f:
              for name in names:
                  data=open(os.path.join(root,name),'rb').read()
                  nb=name.encode('utf-8')
                  crc=zlib.crc32(data)&0xffffffff
                  size=len(data)
                  offset=f.tell()
                  # APKPure outer ZIP: stored entries, zero DOS timestamp,
                  # bit 3 set, sizes/CRC supplied via data descriptor.
                  f.write(struct.pack('<IHHHHHIIIHH',
                      0x04034b50,20,8,0,0,0,0,0,0,len(nb),0))
                  f.write(nb)
                  f.write(data)
                  f.write(struct.pack('<IIII',0x08074b50,crc,size,size))
                  records.append((name,crc,size,offset))

              central_start=f.tell()
              comment=b'ApkPure.com'
              for name,crc,size,offset in records:
                  nb=name.encode('utf-8')
                  f.write(struct.pack('<IHHHHHHIIIHHHHHII',
                      0x02014b50,20,20,8,0,0,0,crc,size,size,
                      len(nb),0,len(comment),0,0,0,offset))
                  f.write(nb)
                  f.write(comment)
              central_size=f.tell()-central_start
              f.write(struct.pack('<IHHHHIIH',
                  0x06054b50,0,0,len(records),len(records),
                  central_size,central_start,0))

          actual=hashlib.sha256(open(out,'rb').read()).hexdigest()
          size=os.path.getsize(out)
          print('Rebuilt size:',size)
          print('Rebuilt SHA-256:',actual)
          expected='78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81'
          if size!=99992559 or actual!=expected:
              raise SystemExit('Rebuilt XAPK is not byte-for-byte identical')
          print('BYTE_FOR_BYTE_MATCH=1')
          PY

          echo "$EXPECTED  $OUT" | sha256sum -c -

      - name: Split into GitHub-safe parts
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          DIR="uploads/My-Coffee-Lounge-1.5.0"
          mkdir -p "$DIR"
          rm -f "$DIR"/My_Coffee_Lounge_1.5.0.xapk.*.part
          split -b 20M -d -a 2 "$SRC" /tmp/My_Coffee_Lounge_1.5.0.xapk.
          for f in /tmp/My_Coffee_Lounge_1.5.0.xapk.[0-9][0-9]; do
            mv "$f" "$DIR/$(basename "$f").part"
          done
          (cd "$DIR" && sha256sum My_Coffee_Lounge_1.5.0.xapk.*.part > SHA256SUMS.txt)
          cat > "$DIR/REASSEMBLE.txt" <<'EOF'
          Original file: My+Coffee+Lounge_1.5.0_APKPure.xapk
          Original size: 99992559 bytes
          Original SHA-256: 78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81

          Linux/macOS:
          cat My_Coffee_Lounge_1.5.0.xapk.*.part > My+Coffee+Lounge_1.5.0_APKPure.xapk
          sha256sum My+Coffee+Lounge_1.5.0_APKPure.xapk

          Windows PowerShell:
          $parts = Get-ChildItem 'My_Coffee_Lounge_1.5.0.xapk.*.part' | Sort-Object Name
          $out = [System.IO.File]::Create('My+Coffee+Lounge_1.5.0_APKPure.xapk')
          foreach ($p in $parts) { $bytes=[System.IO.File]::ReadAllBytes($p.FullName); $out.Write($bytes,0,$bytes.Length) }
          $out.Close()
          Get-FileHash 'My+Coffee+Lounge_1.5.0_APKPure.xapk' -Algorithm SHA256
          EOF
          ls -lh "$DIR"

      - name: Commit parts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/My-Coffee-Lounge-1.5.0
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add My Coffee Lounge 1.5.0 XAPK parts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
