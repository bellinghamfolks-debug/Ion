name: Fetch My Coffee Lounge 1.5.0 XAPK

on:
  push:
    branches:
      - upload/my-coffee-lounge-1.5.0
    paths:
      - .github/workflows/fetch-my-coffee-lounge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upload/my-coffee-lounge-1.5.0

      - name: Fetch Google Play version 318 and verify component hashes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gplay && mkdir -p /tmp/gplay

          python3 -m pip install --quiet gplaydl
          echo "Acquiring anonymous Google Play token..."
          gplaydl auth

          echo "Downloading My Coffee Lounge versionCode 318 with all split APKs..."
          gplaydl download com.delonghigroup.daedalus -v 318 -o /tmp/gplay

          echo "Downloaded files:"
          find /tmp/gplay -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          python3 - <<'PY'
          import hashlib, os, sys
          root='/tmp/gplay'
          expected={
            'base':'afd5256eabaf7d938825e62691188494cda5803d26fd20111ae92c18a4e3cbe2',
            'config.en':'0fbb67f6c390292cc12c8b5b3fda4d4588220a70b54d4c5b5f2389712154ddea',
            'config.fr':'ae55e4d481f25207c4c68e23731690549d1e47a8277bd9904be42b2b5c945241',
            'config.hdpi':'aa8cc2b93feffb48ddf3a06e251ebaa7b59f6c3b5b85f686e650301c6860b8f8',
            'config.arm64_v8a':'6e04a8549e0900c5193a9ec593d675a046832c680ca9795ad305c6f748b52483',
          }
          files=[os.path.join(root,f) for f in os.listdir(root) if f.endswith('.apk')]
          got={}
          for p in files:
              name=os.path.basename(p)
              h=hashlib.sha256(open(p,'rb').read()).hexdigest()
              if 'config.en' in name: key='config.en'
              elif 'config.fr' in name: key='config.fr'
              elif 'config.hdpi' in name: key='config.hdpi'
              elif 'config.arm64_v8a' in name: key='config.arm64_v8a'
              elif '-config.' not in name: key='base'
              else: continue
              got[key]=(p,h,os.path.getsize(p))
              print(f'{key}: {name} size={os.path.getsize(p)} sha256={h}')
          missing=[k for k in expected if k not in got]
          mismatch=[k for k in expected if k in got and got[k][1]!=expected[k]]
          if missing or mismatch:
              print('Missing:', missing)
              print('Mismatched:', mismatch)
              sys.exit(1)
          print('ALL_REQUIRED_COMPONENT_HASHES_MATCH=1')
          # Put exact expected component filenames in a staging directory.
          out='/tmp/xapk-components'
          os.makedirs(out,exist_ok=True)
          mapping={
            'base':'com.delonghigroup.daedalus.apk',
            'config.en':'config.en.apk',
            'config.fr':'config.fr.apk',
            'config.hdpi':'config.hdpi.apk',
            'config.arm64_v8a':'config.arm64_v8a.apk',
          }
          for k,(p,_,_) in got.items():
              if k in mapping:
                  open(os.path.join(out,mapping[k]),'wb').write(open(p,'rb').read())
          PY

      - name: Split into GitHub-safe parts
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          DIR="uploads/My-Coffee-Lounge-1.5.0"
          mkdir -p "$DIR"
          rm -f "$DIR"/My_Coffee_Lounge_1.5.0.xapk.*.part
          split -b 20M -d -a 2 "$SRC" /tmp/My_Coffee_Lounge_1.5.0.xapk.
          for f in /tmp/My_Coffee_Lounge_1.5.0.xapk.[0-9][0-9]; do
            mv "$f" "$DIR/$(basename "$f").part"
          done
          (cd "$DIR" && sha256sum My_Coffee_Lounge_1.5.0.xapk.*.part > SHA256SUMS.txt)
          cat > "$DIR/REASSEMBLE.txt" <<'EOF'
          Original file: My+Coffee+Lounge_1.5.0_APKPure.xapk
          Original size: 99992559 bytes
          Original SHA-256: 78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81

          Linux/macOS:
          cat My_Coffee_Lounge_1.5.0.xapk.*.part > My+Coffee+Lounge_1.5.0_APKPure.xapk
          sha256sum My+Coffee+Lounge_1.5.0_APKPure.xapk

          Windows PowerShell:
          $parts = Get-ChildItem 'My_Coffee_Lounge_1.5.0.xapk.*.part' | Sort-Object Name
          $out = [System.IO.File]::Create('My+Coffee+Lounge_1.5.0_APKPure.xapk')
          foreach ($p in $parts) { $bytes=[System.IO.File]::ReadAllBytes($p.FullName); $out.Write($bytes,0,$bytes.Length) }
          $out.Close()
          Get-FileHash 'My+Coffee+Lounge_1.5.0_APKPure.xapk' -Algorithm SHA256
          EOF
          ls -lh "$DIR"

      - name: Commit parts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/My-Coffee-Lounge-1.5.0
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add My Coffee Lounge 1.5.0 XAPK parts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
