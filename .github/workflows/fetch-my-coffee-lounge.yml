name: Fetch My Coffee Lounge 1.5.0 XAPK

on:
  push:
    branches:
      - upload/my-coffee-lounge-1.5.0
    paths:
      - .github/workflows/fetch-my-coffee-lounge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upload/my-coffee-lounge-1.5.0

      - name: Download exact XAPK and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81"
          OUT="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"

          try_url() {
            local url="$1"
            echo "Trying CDN candidate"
            rm -f "$OUT"
            if curl -fL --compressed --retry 2 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -A "APKPure/3.20.50 (Linux; Android 14)" "$url" -o "$OUT"; then
              local actual size
              actual="$(sha256sum "$OUT" | awk '{print $1}')"
              size="$(stat -c%s "$OUT")"
              echo "Downloaded size: $size bytes"
              echo "SHA-256: $actual"
              if [[ "$actual" == "$EXPECTED" ]]; then
                return 0
              fi
              echo "Hash mismatch; rejecting candidate."
            fi
            return 1
          }

          API="https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=com.delonghigroup.daedalus"
          echo "Requesting APKPure app-version API..."
          curl -fLsS --compressed "$API" \
            -H 'x-cv: 3172501' \
            -H 'x-sv: 29' \
            -H 'x-abis: arm64-v8a,armeabi-v7a,armeabi,x86,x86_64' \
            -H 'x-gp: 1' \
            -o /tmp/apkpure-api.bin

          python3 - <<'PY' > /tmp/candidates.txt
          import re
          b=open('/tmp/apkpure-api.bin','rb').read()
          s=b.decode('latin1', errors='ignore')
          urls=[]
          # APKPure API embeds XAPKJ immediately before XAPK download URLs.
          for m in re.finditer(r'XAPKJ..(https?://[A-Za-z0-9@:%._+~#=()/?&;,-]+)', s, re.S):
              urls.append(m.group(1))
          # Fallback: harvest any absolute URL that visibly targets an XAPK.
          if not urls:
              for m in re.finditer(r'https?://[A-Za-z0-9@:%._+~#=()/?&;,-]+', s):
                  u=m.group(0)
                  if '/XAPK/' in u or 'xapk' in u.lower():
                      urls.append(u)
          seen=set()
          for u in urls:
              if u not in seen:
                  seen.add(u)
                  print(u)
          PY

          count="$(wc -l < /tmp/candidates.txt | tr -d ' ')"
          echo "XAPK candidates returned by API: $count"
          if [[ "$count" -eq 0 ]]; then
            echo "No XAPK CDN links were found in the API response."
            exit 1
          fi

          found=0
          n=0
          while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            n=$((n+1))
            echo "Testing candidate #$n"
            if try_url "$url"; then
              found=1
              break
            fi
            # Latest versions are returned first. Avoid downloading an unbounded archive.
            if [[ "$n" -ge 5 ]]; then
              break
            fi
          done < /tmp/candidates.txt

          if [[ "$found" -ne 1 ]]; then
            echo "No byte-for-byte match found. Nothing will be committed."
            exit 1
          fi
          echo "$EXPECTED  $OUT" | sha256sum -c -

      - name: Split into GitHub-safe parts
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/My+Coffee+Lounge_1.5.0_APKPure.xapk"
          DIR="uploads/My-Coffee-Lounge-1.5.0"
          mkdir -p "$DIR"
          rm -f "$DIR"/My_Coffee_Lounge_1.5.0.xapk.*.part
          split -b 20M -d -a 2 "$SRC" /tmp/My_Coffee_Lounge_1.5.0.xapk.
          for f in /tmp/My_Coffee_Lounge_1.5.0.xapk.[0-9][0-9]; do
            mv "$f" "$DIR/$(basename "$f").part"
          done
          (cd "$DIR" && sha256sum My_Coffee_Lounge_1.5.0.xapk.*.part > SHA256SUMS.txt)
          cat > "$DIR/REASSEMBLE.txt" <<'EOF'
          Original file: My+Coffee+Lounge_1.5.0_APKPure.xapk
          Original size: 99992559 bytes
          Original SHA-256: 78c56e96a73be5cd965fef4a04fd1213c5ac1e28685fd8e1005c3a0fe69c1a81

          Linux/macOS:
          cat My_Coffee_Lounge_1.5.0.xapk.*.part > My+Coffee+Lounge_1.5.0_APKPure.xapk
          sha256sum My+Coffee+Lounge_1.5.0_APKPure.xapk

          Windows PowerShell:
          $parts = Get-ChildItem 'My_Coffee_Lounge_1.5.0.xapk.*.part' | Sort-Object Name
          $out = [System.IO.File]::Create('My+Coffee+Lounge_1.5.0_APKPure.xapk')
          foreach ($p in $parts) { $bytes=[System.IO.File]::ReadAllBytes($p.FullName); $out.Write($bytes,0,$bytes.Length) }
          $out.Close()
          Get-FileHash 'My+Coffee+Lounge_1.5.0_APKPure.xapk' -Algorithm SHA256
          EOF
          ls -lh "$DIR"

      - name: Commit parts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/My-Coffee-Lounge-1.5.0
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add My Coffee Lounge 1.5.0 XAPK parts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
