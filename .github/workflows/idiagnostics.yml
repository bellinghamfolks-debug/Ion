name: iDiagnostics 2.0 Quality Gate

on:
  push:
    branches: [main, "claude/**", "codex/**"]
    paths:
      - "iDiagnostics/**"
      - ".github/workflows/idiagnostics.yml"
      - "codemagic.yaml"
  pull_request:
    paths:
      - "iDiagnostics/**"
      - ".github/workflows/idiagnostics.yml"
      - "codemagic.yaml"

concurrency:
  group: idiagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, unit tests, and accessibility checks
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iDiagnostics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate manifests and generate project
        run: |
          set -euo pipefail
          plutil -lint Resources/PrivacyInfo.xcprivacy
          xcodegen generate
          xcodebuild -list -project iDiagnostics.xcodeproj

      - name: Select and boot an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          devices = [
              device
              for runtime, values in payload["devices"].items()
              if "iOS" in runtime
              for device in values
              if device.get("isAvailable") and "iPhone" in device.get("name", "")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[-1]["udid"])
          ')
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and build app
        run: |
          set -o pipefail
          xcodebuild test \
            -project iDiagnostics.xcodeproj \
            -scheme iDiagnostics \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            -resultBundlePath build/iDiagnosticsTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify privacy and accessibility source contract
        run: |
          set -euo pipefail
          test -f Resources/PrivacyInfo.xcprivacy
          test -f Sources/Utilities/AppLog.swift
          ! grep -R "as!" Sources --include='*.swift'
          ! grep -R "try!" Sources --include='*.swift'
          grep -R "accessibilityLabel\|accessibilityElement" Sources/Views --include='*.swift' >/dev/null

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iDiagnostics-test-results
          path: iDiagnostics/build/iDiagnosticsTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
