name: iOS

on:
  push:
    branches: [main, "claude/coffee-access"]
  pull_request:

concurrency:
  group: coffee-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strings table covers every key in both languages
        run: python3 Scripts/validate_strings.py
      - name: Colour contrast meets WCAG AA
        run: python3 Scripts/check_contrast.py
      - name: Siri drink list matches the catalog
        run: python3 Scripts/generate_intents.py --check

  test:
    name: Build & test (iOS Simulator)
    runs-on: macos-15
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[-1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project CoffeeAccess.xcodeproj \
            -scheme CoffeeAccess \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

  unsigned-ipa:
    name: Unsigned IPA
    runs-on: macos-15
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CoffeeAccess.xcodeproj \
            -scheme CoffeeAccess \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/CoffeeAccess.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CoffeeAccess-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CoffeeAccess-unsigned
          path: CoffeeAccess-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
