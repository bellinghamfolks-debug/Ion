# PDFToWord iOS — GitHub Actions compile check.
#
# Builds the committed Xcode project for the iOS Simulator on a macOS
# runner (unsigned — compile check only). The device IPA + signing live
# in Codemagic (see codemagic.yaml). Basir is preserved on the main branch.

name: Swift

on:
  push:
    branches: [main, master, develop, "claude/**"]
  pull_request:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PDFToWord.xcodeproj \
            -scheme PDFToWord \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES
