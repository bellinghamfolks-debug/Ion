# EnglishNova iOS — GitHub Actions compile check.
#
# Generates the Xcode project with XcodeGen and builds for the iOS
# Simulator on a macOS runner (unsigned — compile check only). The
# device IPA + signing live in Codemagic (see codemagic.yaml).
#
# Basir's code is preserved on its own branch; this workflow builds the
# repo's active project, EnglishNova.

name: Swift

on:
  push:
    branches: [main, master, develop, "claude/englishnova-ios"]
  pull_request:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14

    defaults:
      run:
        working-directory: EnglishNova

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project EnglishNova.xcodeproj \
            -scheme EnglishNova \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES
