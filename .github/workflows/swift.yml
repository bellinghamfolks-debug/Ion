# Basir iOS — GitHub Actions build.
#
# NOTE: this replaces the contents of GitHub's default "Swift" starter
# workflow. That template runs `swift build` / `swift test`, which only
# works for a Swift Package Manager package. Basir is a SwiftUI **iOS
# app** with no Package.swift and depends on UIKit/SwiftUI/PDFKit/
# AVFoundation (iOS SDK, macOS-only) — so `swift build` always fails
# with "could not find Package.swift".
#
# Instead we generate the Xcode project with XcodeGen and build for the
# iOS Simulator on a macOS runner (unsigned — compile check only).
# Device IPA + signing live in Codemagic (see codemagic.yaml).

name: Swift

on:
  push:
    branches: [main, master, develop, "claude/file-extraction-repo-migration-hqgNY"]
  pull_request:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Basir.xcodeproj \
            -scheme Basir \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES
