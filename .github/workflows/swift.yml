# ZTEControl iOS — GitHub Actions build check.
#
# Generates the Xcode project with XcodeGen and builds ZTEControl for the
# iOS Simulator. The device IPA lives in Codemagic (see codemagic.yaml).

name: Swift

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14
    defaults:
      run:
        working-directory: ZTEControl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs
                     if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[-1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ZTEControl.xcodeproj \
            -scheme ZTEControl \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
