name: Basir iOS quality gate

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, "claude/**"]
  pull_request:

concurrency:
  group: basir-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build, analyze, test, and inspect bundles
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Python dependencies for checks
        run: python3 -m pip install --quiet pyyaml || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Run platform-independent checks
        run: python3 ../scripts/verify_project.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d Basir.xcodeproj

      - name: Static analyzer
        run: |
          set -euo pipefail
          xcodebuild analyze \
            -project Basir.xcodeproj \
            -scheme Basir \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build-analyze \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Basir.xcodeproj \
            -scheme Basir \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Verify host app and share extension
        run: |
          set -euo pipefail
          APP='build/Build/Products/Debug-iphonesimulator/Basir.app'
          test -d "$APP"
          test -d "$APP/PlugIns/BasirShare.appex"
          plutil -lint "$APP/Info.plist"
          plutil -lint "$APP/PlugIns/BasirShare.appex/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          HOST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          SHARE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/PlugIns/BasirShare.appex/Info.plist")
          HOST_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          SHARE_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/PlugIns/BasirShare.appex/Info.plist")
          test "$HOST_VERSION" = "$SHARE_VERSION"
          test "$HOST_BUILD" = "$SHARE_BUILD"

      - name: Run unit tests
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 ../scripts/select_ios_simulator.py)
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test \
            -project Basir.xcodeproj \
            -scheme Basir \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
