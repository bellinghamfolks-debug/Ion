# EnglishNova iOS + integrated server checks.
name: Swift

on:
  push:
    branches: [main, master, develop, "claude/**"]
  pull_request:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (iOS Simulator)
    runs-on: macos-14

    defaults:
      run:
        working-directory: EnglishNova

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Arabic interface copy
        run: python3 Scripts/audit_arabic_ui.py

      - name: Validate integrated server AI syntax
        working-directory: .
        run: |
          node --check server/src/learnerProfile.js
          node --check server/src/routes/aiCore.js
          node --check server/src/routes/aiTutorRoutes.js
          node --check server/src/routes/aiLearningRoutes.js
          node --check server/src/routes/aiRoutes.js
          node --check server/src/routes/progressRoutes.js
          node --check server/src/index.js

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs
                     if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[-1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep iPhone

      - name: Build and run unit tests (decodes bundled curriculum)
        run: |
          set -o pipefail
          xcodebuild test \
            -project EnglishNova.xcodeproj \
            -scheme EnglishNova \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify curriculum.json is inside the app bundle
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/EnglishNova.app"
          if [ ! -f "$APP/Curriculum/curriculum.json" ]; then
            echo "❌ Curriculum/curriculum.json missing from app bundle"
            exit 1
          fi
          echo "✅ Curriculum/curriculum.json bundled correctly"
