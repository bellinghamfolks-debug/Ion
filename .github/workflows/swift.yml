# DocConverter iOS — GitHub Actions build check.
#
# Generates the Xcode project with XcodeGen and builds for the iOS
# Simulator. The device IPA + signing live in Codemagic (codemagic.yaml).

name: Swift

on:
  push:
    branches: [main, master, develop, "claude/**"]
  pull_request:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    # iOS 26 SDK ships with Xcode 26, which needs a recent macOS runner image.
    runs-on: macos-15

    defaults:
      run:
        working-directory: DocConverter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DocConverter.xcodeproj \
            -scheme DocConverter \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Verify .app bundle was produced
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/DocConverter.app"
          if [ ! -d "$APP" ]; then
            echo "❌ Build did not produce $APP"
            exit 1
          fi
          echo "✅ Built $APP"
