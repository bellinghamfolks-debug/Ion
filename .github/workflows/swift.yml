# EnglishNova iOS + integrated server release checks.
name: Swift

on:
  push:
    branches: [main, master, develop, "claude/**", "codex/**", "englishnova-build50"]
  pull_request:

concurrency:
  group: englishnova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    name: Source snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create latest source archive
        run: |
          set -euo pipefail
          git archive --format=zip --output=EnglishNova-source-latest.zip HEAD \
            EnglishNova server codemagic.yaml .github/workflows/swift.yml
          unzip -t EnglishNova-source-latest.zip >/dev/null
      - name: Upload latest source
        uses: actions/upload-artifact@v4
        with:
          name: EnglishNova-source-latest
          path: EnglishNova-source-latest.zip
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build & test (iOS Simulator)
    runs-on: macos-14
    defaults:
      run:
        working-directory: EnglishNova
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit Arabic interface copy
        run: python3 Scripts/audit_arabic_ui.py
      - name: Validate current project and localization coverage
        run: python3 Scripts/validate_project.py
      - name: Verify current release integrity
        run: python3 Scripts/verify_release_recovery.py
      - name: Validate curriculum semantics
        run: |
          python3 Scripts/validate_content.py EnglishNova/Resources/Curriculum/curriculum.json
          Scripts/validate_core_semantics.sh
      - name: Validate all integrated server JavaScript syntax
        working-directory: .
        run: |
          set -euo pipefail
          find server/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify production server configuration guard
        working-directory: .
        run: |
          NODE_ENV=production \
          DATABASE_URL='postgres://user:pass@localhost:5432/englishnova' \
          JWT_SECRET='ci-only-secret-012345678901234567890123456789' \
          GOOGLE_SERVER_CLIENT_ID='123456789-ci.apps.googleusercontent.com' \
          node --input-type=module -e "import('./server/src/config.js').then(m => m.assertRuntimeConfig())"
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs
                     if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[-1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project EnglishNova.xcodeproj \
            -scheme EnglishNova \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Verify built app release integrity
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/EnglishNova.app"
          test -f "$APP/Curriculum/curriculum.json"
          python3 Scripts/verify_release_recovery.py --app "$APP"

  unsigned-ipa:
    name: Unsigned IPA (EnglishNova current)
    runs-on: macos-14
    env:
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
    defaults:
      run:
        working-directory: EnglishNova
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate optional Google OAuth settings
        run: |
          configured=0
          for name in GOOGLE_IOS_CLIENT_ID GOOGLE_SERVER_CLIENT_ID GOOGLE_REVERSED_CLIENT_ID; do
            [[ -n "${!name:-}" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -eq 3 ]]; then
            Scripts/validate_google_config.sh
          elif [[ "$configured" -ne 0 ]]; then
            echo "Google OAuth configuration is partial; refusing an inconsistent build."
            exit 1
          else
            echo "Google OAuth is unavailable in this unsigned build; offline learning remains available."
          fi
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify current release integrity
        run: python3 Scripts/verify_release_recovery.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          EXTRA_SETTINGS=()
          if [[ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]]; then EXTRA_SETTINGS+=("GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID"); fi
          if [[ -n "${GOOGLE_SERVER_CLIENT_ID:-}" ]]; then EXTRA_SETTINGS+=("GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"); fi
          if [[ -n "${GOOGLE_REVERSED_CLIENT_ID:-}" ]]; then EXTRA_SETTINGS+=("GOOGLE_REVERSED_CLIENT_ID=$GOOGLE_REVERSED_CLIENT_ID"); fi
          xcodebuild build \
            -project EnglishNova.xcodeproj \
            -scheme EnglishNova \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            "${EXTRA_SETTINGS[@]}"
      - name: Verify release integrity and create unsigned IPA
        run: |
          set -euo pipefail
          APP="build-unsigned/Build/Products/Release-iphoneos/EnglishNova.app"
          test -d "$APP"
          test -f "$APP/Curriculum/curriculum.json"
          python3 Scripts/verify_release_recovery.py --app "$APP"
          rm -rf Payload EnglishNova-latest-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/EnglishNova.app
          zip -qry EnglishNova-latest-unsigned.ipa Payload
          unzip -l EnglishNova-latest-unsigned.ipa | grep 'Payload/EnglishNova.app/Curriculum/curriculum.json'
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: EnglishNova-latest-unsigned
          path: EnglishNova/EnglishNova-latest-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
