name: DocConverter
options:
  bundleIdPrefix: com.bellinghamfolks
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  DocConverter:
    type: application
    platform: iOS
    sources:
      - path: DocConverter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bellinghamfolks.docconverter
    info:
      path: DocConverter/Info.plist
      properties:
        # Arabic-only localization so iOS renders ALL system UI (QuickLook
        # preview, document scanner, share sheet, alert buttons, etc.) in Arabic
        # regardless of the device language — this app has no English UI.
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations:
          - ar
        CFBundleAllowMixedLocalizations: true
        CFBundleDisplayName: محول المستندات
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Camera scanning (VisionKit document scanner).
        NSCameraUsageDescription: تُستخدم الكاميرا لمسح المستندات الورقية وتحويلها إلى ملف Word.
        # Receive PDFs opened/shared from other apps ("فتح في محوّل المستندات").
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: مستند PDF
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
