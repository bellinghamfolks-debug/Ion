name: EnglishNova
options:
  bundleIdPrefix: com.englishnova
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ar
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.0.0
    INFOPLIST_KEY_CFBundleDisplayName: EnglishNova
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_NSMicrophoneUsageDescription: نستخدم الميكروفون لتحليل نطقك أثناء تمارين المحادثة.
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: نستخدم التعرف على الكلام لتحويل نطقك إلى نص وتقديم ملاحظات تعليمية.
    INFOPLIST_KEY_NSCameraUsageDescription: نستخدم الكاميرا لالتقاط صورة ملفك الشخصي.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: نستخدم مكتبة الصور لاختيار صورة ملفك الشخصي.
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  EnglishNova:
    type: application
    platform: iOS
    sources:
      - path: EnglishNova
        excludes:
          - Resources
          - Localization
          - Info.plist
      - path: EnglishNova/Resources/Curriculum
        type: folder
        buildPhase: resources
      - path: EnglishNova/Resources/LocalizationData
        type: folder
        buildPhase: resources
      - path: EnglishNova/Localization
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.englishnova.app
        INFOPLIST_FILE: EnglishNova/Info.plist
    scheme:
      testTargets:
        - EnglishNovaTests
  EnglishNovaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EnglishNovaTests
    dependencies:
      - target: EnglishNova
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.englishnova.tests
