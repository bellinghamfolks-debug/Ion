# Codemagic CI/CD for EnglishNova Build 56.
# ENGLISHNOVA_SERVER_URL points the iOS app at the standalone Google Cloud Run backend.
# Google OAuth is required for the unsigned device build and is imported from
# the Codemagic application variable group named englishnova_google.

workflows:
  ios-simulator-build:
    name: EnglishNova iOS — simulator quality build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: "EnglishNova"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "codex/**"
          include: true
        - pattern: "englishnova-build50"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Audit and validate source
        script: |
          cd "$XCODE_PROJECT_DIR"
          python3 Scripts/audit_arabic_ui.py
          python3 Scripts/validate_project.py
          python3 Scripts/verify_release_recovery.py

      - name: Generate Xcode project
        script: |
          cd "$XCODE_PROJECT_DIR"
          xcodegen generate

      - name: Build for iOS Simulator
        script: |
          cd "$XCODE_PROJECT_DIR"
          set -o pipefail
          EXTRA_SETTINGS=()
          if [[ -n "${ENGLISHNOVA_SERVER_URL:-}" ]]; then
            EXTRA_SETTINGS+=("ENGLISHNOVA_SERVER_URL=$ENGLISHNOVA_SERVER_URL")
          fi
          xcodebuild build \
            -project EnglishNova.xcodeproj \
            -scheme EnglishNova \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            "${EXTRA_SETTINGS[@]}" \
            | xcpretty || exit 1

      - name: Verify app bundle and release integrity
        script: |
          cd "$XCODE_PROJECT_DIR"
          APP_PATH="build/Build/Products/Debug-iphonesimulator/EnglishNova.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Curriculum/curriculum.json"
          python3 Scripts/verify_release_recovery.py --app "$APP_PATH"

    artifacts:
      - EnglishNova/build/Build/Products/Debug-iphonesimulator/EnglishNova.app

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: false
          failure: true

  ios-unsigned-ipa:
    name: EnglishNova iOS — Build 56 unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - englishnova_google
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: "EnglishNova"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "codex/**"
          include: true
        - pattern: "englishnova-build50"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Validate cloud and Google configuration
        script: |
          if [[ -n "${ENGLISHNOVA_SERVER_URL:-}" ]]; then
            if [[ "$ENGLISHNOVA_SERVER_URL" != https://* ]]; then
              echo "ENGLISHNOVA_SERVER_URL must use HTTPS."
              exit 1
            fi
            echo "Standalone EnglishNova backend will be injected."
          else
            echo "ENGLISHNOVA_SERVER_URL is not set; the app will use its built-in production fallback."
          fi

          cd "$XCODE_PROJECT_DIR"
          Scripts/validate_google_config.sh

      - name: Audit and validate source
        script: |
          cd "$XCODE_PROJECT_DIR"
          python3 Scripts/audit_arabic_ui.py
          python3 Scripts/validate_project.py
          python3 Scripts/verify_release_recovery.py

      - name: Generate Xcode project
        script: |
          cd "$XCODE_PROJECT_DIR"
          xcodegen generate

      - name: Archive unsigned app
        script: |
          cd "$XCODE_PROJECT_DIR"
          set -o pipefail

          EXTRA_SETTINGS=(
            "GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID"
            "GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
            "GOOGLE_REVERSED_CLIENT_ID=$GOOGLE_REVERSED_CLIENT_ID"
          )
          if [[ -n "${ENGLISHNOVA_SERVER_URL:-}" ]]; then
            EXTRA_SETTINGS+=("ENGLISHNOVA_SERVER_URL=$ENGLISHNOVA_SERVER_URL")
          fi

          xcodebuild archive \
            -project EnglishNova.xcodeproj \
            -scheme EnglishNova \
            -configuration Release \
            -archivePath build/EnglishNova.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${EXTRA_SETTINGS[@]}" \
            | xcpretty || exit 1

      - name: Verify release integrity and wrap IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR/build"
          APP_PATH="EnglishNova.xcarchive/Products/Applications/EnglishNova.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Curriculum/curriculum.json"

          python3 "$CM_BUILD_DIR/$XCODE_PROJECT_DIR/Scripts/verify_release_recovery.py" --app "$APP_PATH"

          BACKEND=$(/usr/libexec/PlistBuddy -c 'Print :EnglishNovaServerURL' "$APP_PATH/Info.plist" 2>/dev/null || true)
          CLIENT=$(/usr/libexec/PlistBuddy -c 'Print :GIDClientID' "$APP_PATH/Info.plist" 2>/dev/null || true)
          SERVER=$(/usr/libexec/PlistBuddy -c 'Print :GIDServerClientID' "$APP_PATH/Info.plist" 2>/dev/null || true)
          SCHEME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP_PATH/Info.plist" 2>/dev/null || true)

          if [[ -n "${ENGLISHNOVA_SERVER_URL:-}" ]]; then
            test "$BACKEND" = "$ENGLISHNOVA_SERVER_URL"
            echo "EnglishNova Cloud backend substitution: PASS"
          fi

          test "$CLIENT" = "$GOOGLE_IOS_CLIENT_ID"
          test "$SERVER" = "$GOOGLE_SERVER_CLIENT_ID"
          test "$SCHEME" = "$GOOGLE_REVERSED_CLIENT_ID"
          echo "Google OAuth substitution: PASS"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          SHORT_SHA=$(git -C "$CM_BUILD_DIR" rev-parse --short HEAD)
          IPA_NAME="EnglishNova-${SHORT_SHA}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          cp "$IPA_NAME" EnglishNova-unsigned.ipa
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$IPA_NAME" "$CM_BUILD_DIR/artifacts/"
          cp EnglishNova-unsigned.ipa "$CM_BUILD_DIR/artifacts/"
          rm -rf Payload

      - name: Create exact source snapshot
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/EnglishNova-source-latest.zip HEAD \
            EnglishNova server codemagic.yaml .github/workflows/swift.yml
          unzip -t artifacts/EnglishNova-source-latest.zip >/dev/null

    artifacts:
      - artifacts/*.ipa
      - artifacts/EnglishNova-source-latest.zip
      - EnglishNova/build/EnglishNova.xcarchive

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: true
          failure: true
