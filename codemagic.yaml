# Codemagic CI/CD for DocConverter (iOS) — the accessibility PDF→Word converter.
#
# Built the same way as EnglishNova: XcodeGen regenerates DocConverter.xcodeproj
# from DocConverter/project.yml at build time (no binary Xcode project committed).
#
# Every push to claude/**, main, or master triggers BOTH:
#   1. ios-simulator-build → fast .app compile smoke test (~3-5 min)
#   2. ios-unsigned-ipa    → real .ipa archive, emailed + downloadable.

workflows:

  ios-simulator-build:
    name: DocConverter iOS — simulator build (no Apple Developer account needed)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: "DocConverter"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        script: |
          cd $XCODE_PROJECT_DIR
          xcodegen generate
          ls -la DocConverter.xcodeproj/

      - name: Build for iOS Simulator
        script: |
          cd $XCODE_PROJECT_DIR
          xcodebuild build \
            -project DocConverter.xcodeproj \
            -scheme DocConverter \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            | xcpretty || exit 1

      - name: Verify .app bundle was produced
        script: |
          cd $XCODE_PROJECT_DIR
          APP_PATH="build/Build/Products/Debug-iphonesimulator/DocConverter.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Build did not produce $APP_PATH"
            exit 1
          fi
          echo "✅ Built $APP_PATH"
          du -sh "$APP_PATH"

    artifacts:
      - DocConverter/build/Build/Products/Debug-iphonesimulator/DocConverter.app

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: false
          failure: true

  # ---------------------------------------------------------------------
  # Device-ready unsigned IPA (install via AltStore / Sideloadly, or resign).
  # ---------------------------------------------------------------------
  ios-unsigned-ipa:
    name: DocConverter iOS — unsigned IPA (auto-built on every push)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: "DocConverter"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $XCODE_PROJECT_DIR
          xcodegen generate

      - name: Stamp build number from commit count
        script: |
          cd $XCODE_PROJECT_DIR
          BUILD_NUMBER=$(git rev-list HEAD --count)
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Archive (unsigned, for inspection or external resigning)
        script: |
          cd $XCODE_PROJECT_DIR
          xcodebuild archive \
            -project DocConverter.xcodeproj \
            -scheme DocConverter \
            -configuration Release \
            -archivePath build/DocConverter.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit 1

      - name: Wrap .app into unsigned .ipa
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR/build"

          APP_PATH="DocConverter.xcarchive/Products/Applications/DocConverter.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Missing app bundle: $APP_PATH"
            find . -maxdepth 5 -type d -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          SHORT_SHA=$(git -C "$CM_BUILD_DIR" rev-parse --short HEAD)
          IPA_NAME="DocConverter-${SHORT_SHA}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          cp "$IPA_NAME" DocConverter-unsigned.ipa

          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$IPA_NAME" "$CM_BUILD_DIR/artifacts/"
          cp DocConverter-unsigned.ipa "$CM_BUILD_DIR/artifacts/"

          echo "✅ IPA files ready:"
          ls -lh "$CM_BUILD_DIR/artifacts"/*.ipa
          rm -rf Payload

    artifacts:
      - artifacts/*.ipa
      - DocConverter/build/DocConverter.xcarchive

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: true
          failure: true
