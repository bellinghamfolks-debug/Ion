workflows:
  basir-ios-unsigned:
    name: Basir iOS 2.3.0 — unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - basir_secrets
      xcode: latest
      vars:
        BASIR_SERVER_URL: "https://basir-convert-api-1045442243599.europe-west4.run.app"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "basir-ios-v2.3.0-codemagic"
          include: true

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/.cache/Homebrew

    scripts:
      - name: Reconstruct and verify Basir source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          rm -rf _basir_build
          mkdir -p _basir_build
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib

          base = pathlib.Path("basir_source_parts")
          names = [
              "part-00.b64",
              "part-01.b64",
              "part-02.b64",
              "part-03.b64",
              "part-04.b64",
              "part-05.b64",
              "part-06.b64",
              "part-07.b64",
              "part-08.b64",
              "part-09a.b64",
              "part-09b.b64",
              "part-10.b64",
              "part-11.b64",
              "part-12a.b64",
              "part-12b.b64",
              "part-13.b64",
          ]

          missing = [name for name in names if not (base / name).is_file()]
          if missing:
              raise SystemExit("Missing Basir source parts: " + ", ".join(missing))

          encoded = "".join((base / name).read_text(encoding="utf-8").strip() for name in names)
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          expected = "584a26e03b6e1fe3a3505f15b552aec13c862a52f433c8fe3f656affb277f194"
          print("Basir source SHA-256:", actual)
          if actual != expected:
              raise SystemExit(f"Source archive checksum mismatch: {actual} != {expected}")

          pathlib.Path("/tmp/Basir_iOS_source.zip").write_bytes(raw)
          PY

          ditto -x -k /tmp/Basir_iOS_source.zip "$CM_BUILD_DIR/_basir_build"
          test -f "$CM_BUILD_DIR/_basir_build/BasirConvertiOS/project.yml"
          test -f "$CM_BUILD_DIR/_basir_build/BasirConvertiOS/scripts/verify_project.sh"
          test -f "$CM_BUILD_DIR/_basir_build/BasirConvertiOS/scripts/build_unsigned_ipa.sh"

      - name: Environment diagnostics
        script: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          if [ -z "${BASIR_CLIENT_TOKEN:-}" ]; then
            echo "BASIR_CLIENT_TOKEN is missing. Add it as a secure variable in Codemagic group: basir_secrets"
            exit 2
          fi
          echo "BASIR_SERVER_URL=$BASIR_SERVER_URL"
          echo "BASIR_CLIENT_TOKEN is configured securely."

      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Verify source integrity
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/_basir_build/BasirConvertiOS"
          chmod +x scripts/verify_project.sh scripts/build_unsigned_ipa.sh
          scripts/verify_project.sh

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/_basir_build/BasirConvertiOS"
          xcodegen generate --spec project.yml
          test -d BasirConvert.xcodeproj

      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/_basir_build/BasirConvertiOS"
          xcodebuild -resolvePackageDependencies \
            -project BasirConvert.xcodeproj \
            -scheme BasirConvert

      - name: Build unsigned IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/_basir_build/BasirConvertiOS"
          REGENERATE_PROJECT=0 \
          BASIR_SERVER_URL="$BASIR_SERVER_URL" \
          BASIR_CLIENT_TOKEN="$BASIR_CLIENT_TOKEN" \
          scripts/build_unsigned_ipa.sh

      - name: Validate IPA and export artifacts
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/_basir_build/BasirConvertiOS"
          IPA="dist/Basir_v2.3.0_unsigned.ipa"
          test -s "$IPA"
          unzip -t "$IPA"
          ACTUAL=$(shasum -a 256 "$IPA" | awk '{print $1}')
          echo "IPA SHA-256: $ACTUAL"
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$IPA" "$CM_BUILD_DIR/artifacts/"
          if [ -f "$IPA.sha256" ]; then
            cp "$IPA.sha256" "$CM_BUILD_DIR/artifacts/"
          else
            shasum -a 256 "$IPA" > "$CM_BUILD_DIR/artifacts/Basir_v2.3.0_unsigned.ipa.sha256"
          fi

    artifacts:
      - artifacts/*.ipa
      - artifacts/*.sha256
      - _basir_build/BasirConvertiOS/build/DerivedData/Build/Products/Release-iphoneos/BasirConvert.app.dSYM
