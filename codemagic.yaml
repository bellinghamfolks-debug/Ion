workflows:
  basir-ios-unsigned:
    name: Basir iOS 3.0 — Clean Source Build
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      groups:
        - basir_secrets
      xcode: latest
      vars:
        BASIR_SERVER_URL: "https://basir-convert-api-1045442243599.europe-west4.run.app"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "basir-ios-v2.3.0-codemagic"
          include: true

    scripts:
      - name: Verify checked-in source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/BasirConvertiOS"
          test -n "${BASIR_CLIENT_TOKEN:-}"
          python3 tools/verify_project.py . --source-only
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate and verify Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/BasirConvertiOS"
          xcodegen generate --spec project.yml
          chmod +x scripts/verify_project.sh scripts/build_unsigned_ipa.sh
          scripts/verify_project.sh
          xcodebuild -resolvePackageDependencies \
            -project BasirConvert.xcodeproj \
            -scheme BasirConvert

      - name: Run unit tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/BasirConvertiOS"
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for devices in data.values() for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          test -n "$SIMULATOR_ID"
          xcodebuild test \
            -project BasirConvert.xcodeproj \
            -scheme BasirConvert \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/BasirConvertiOS"
          BASIR_SERVER_URL="$BASIR_SERVER_URL" \
          BASIR_CLIENT_TOKEN="$BASIR_CLIENT_TOKEN" \
          scripts/build_unsigned_ipa.sh

      - name: Validate unsigned artifact
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/BasirConvertiOS"
          IPA="dist/Basir_v3.0.0_unsigned.ipa"
          test -s "$IPA"
          shasum -a 256 -c "$IPA.sha256"
          unzip -t "$IPA"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$IPA" -d "$VERIFY_DIR"
          APP="$VERIFY_DIR/Payload/BasirConvert.app"
          EXTENSION="$APP/PlugIns/BasirShareExtension.appex"
          test -f "$APP/BasirConvert"
          test -f "$EXTENSION/BasirShareExtension"
          test -z "$(find "$APP" -type d -name _CodeSignature -print -quit)"
          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo "IPA unexpectedly contains a code signature"
            exit 1
          fi
          if codesign -dv "$EXTENSION" >/dev/null 2>&1; then
            echo "Share Extension unexpectedly contains a code signature"
            exit 1
          fi

    artifacts:
      - BasirConvertiOS/dist/Basir_v3.0.0_unsigned.ipa
      - BasirConvertiOS/dist/Basir_v3.0.0_unsigned.ipa.sha256
      - BasirConvertiOS/build/DerivedData/Build/Products/Release-iphoneos/BasirConvert.app.dSYM

