# Codemagic CI/CD for PDFToWord (iOS).
#
# This repo's active iOS build is PDFToWord. The project ships a committed
# Xcode project (PDFToWord.xcodeproj), so no XcodeGen step is needed — we
# build it directly. Basir is preserved on the `main` branch.
#
# Every push to claude/**, main, or master triggers BOTH:
#   1. ios-simulator-build → fast .app compile smoke test
#   2. ios-unsigned-ipa    → real .ipa archive, emailed + posted as a
#      downloadable Codemagic artifact.

workflows:

  ios-simulator-build:
    name: PDFToWord iOS — simulator build (no Apple Developer account needed)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project PDFToWord.xcodeproj \
            -scheme PDFToWord \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            | xcpretty || exit 1

      - name: Verify .app bundle was produced
        script: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/PDFToWord.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Build did not produce $APP_PATH"
            exit 1
          fi
          echo "✅ Built $APP_PATH"
          du -sh "$APP_PATH"

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/PDFToWord.app

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: false
          failure: true

  # ---------------------------------------------------------------------
  # Device-ready unsigned IPA. Archives the app and wraps it into an .ipa
  # that can be installed on a real iPhone with a sideloading tool
  # (AltStore / Sideloadly / Signulous) or resigned with a certificate.
  # ---------------------------------------------------------------------
  ios-unsigned-ipa:
    name: PDFToWord iOS — unsigned IPA (auto-built on every push)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Stamp build number from commit count
        script: |
          BUILD_NUMBER=$(git rev-list HEAD --count)
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Archive (unsigned, for inspection or external resigning)
        script: |
          xcodebuild archive \
            -project PDFToWord.xcodeproj \
            -scheme PDFToWord \
            -configuration Release \
            -archivePath build/PDFToWord.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit 1

      - name: Wrap .app into unsigned .ipa
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/build"

          APP_PATH="PDFToWord.xcarchive/Products/Applications/PDFToWord.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Missing app bundle: $APP_PATH"
            find . -maxdepth 5 -type d -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          SHORT_SHA=$(git -C "$CM_BUILD_DIR" rev-parse --short HEAD)
          IPA_NAME="PDFToWord-${SHORT_SHA}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          cp "$IPA_NAME" PDFToWord-unsigned.ipa

          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$IPA_NAME" "$CM_BUILD_DIR/artifacts/"
          cp PDFToWord-unsigned.ipa "$CM_BUILD_DIR/artifacts/"

          echo "✅ IPA files ready:"
          ls -lh "$CM_BUILD_DIR/artifacts"/*.ipa
          rm -rf Payload

    artifacts:
      - artifacts/*.ipa
      - build/PDFToWord.xcarchive

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: true
          failure: true
