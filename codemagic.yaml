# Codemagic CI/CD for ZTEControl (iOS).
#
# This branch's active iOS build is ZTEControl — an app to control the
# frequency bands of a ZTE MU5001 router over its local Wi-Fi admin API.
# XcodeGen regenerates ZTEControl.xcodeproj from ZTEControl/project.yml at
# build time, so no binary Xcode project is committed.
#
# Every push builds BOTH:
#   1. ios-simulator-build → fast .app compile smoke test
#   2. ios-unsigned-ipa    → device-installable unsigned .ipa

workflows:

  ios-simulator-build:
    name: ZTEControl iOS — simulator build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: "ZTEControl"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "main"
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        script: |
          cd $XCODE_PROJECT_DIR
          xcodegen generate
          ls -la ZTEControl.xcodeproj/
      - name: Build for iOS Simulator
        script: |
          cd $XCODE_PROJECT_DIR
          xcodebuild build \
            -project ZTEControl.xcodeproj \
            -scheme ZTEControl \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            | xcpretty || exit 1
      - name: Verify .app bundle was produced
        script: |
          cd $XCODE_PROJECT_DIR
          APP_PATH="build/Build/Products/Debug-iphonesimulator/ZTEControl.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Build did not produce $APP_PATH"; exit 1
          fi
          echo "✅ Built $APP_PATH"
    artifacts:
      - ZTEControl/build/Build/Products/Debug-iphonesimulator/ZTEControl.app

  ios-unsigned-ipa:
    name: ZTEControl iOS — unsigned IPA (auto-built on every push)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: "ZTEControl"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/**"
          include: true
        - pattern: "main"
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd $XCODE_PROJECT_DIR
          xcodegen generate
      - name: Stamp build number from commit count
        script: |
          cd $XCODE_PROJECT_DIR
          BUILD_NUMBER=$(git rev-list HEAD --count)
          agvtool new-version -all $BUILD_NUMBER || true
      - name: Archive (unsigned)
        script: |
          cd $XCODE_PROJECT_DIR
          xcodebuild archive \
            -project ZTEControl.xcodeproj \
            -scheme ZTEControl \
            -configuration Release \
            -archivePath build/ZTEControl.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit 1
      - name: Wrap .app into unsigned .ipa
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR/build"
          APP_PATH="ZTEControl.xcarchive/Products/Applications/ZTEControl.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Missing app bundle: $APP_PATH"
            find . -maxdepth 5 -type d -name "*.app" -print
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          SHORT_SHA=$(git -C "$CM_BUILD_DIR" rev-parse --short HEAD)
          IPA_NAME="ZTEControl-${SHORT_SHA}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          cp "$IPA_NAME" ZTEControl-unsigned.ipa
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$IPA_NAME" "$CM_BUILD_DIR/artifacts/"
          cp ZTEControl-unsigned.ipa "$CM_BUILD_DIR/artifacts/"
          echo "✅ IPA ready:"; ls -lh "$CM_BUILD_DIR/artifacts"/*.ipa
          rm -rf Payload
    artifacts:
      - artifacts/*.ipa
      - ZTEControl/build/ZTEControl.xcarchive
    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: true
          failure: true
