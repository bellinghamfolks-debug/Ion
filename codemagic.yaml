# Codemagic CI/CD for TrueFrame (iOS).
#
# TrueFrame is the accessible, non-generative camera + photo-straightening app
# for blind and low-vision photographers. This branch (claude/trueframe-ios) is
# dedicated to it, so Codemagic here builds TrueFrame only.
#
# Building an iOS app needs macOS + Xcode, so we use Codemagic's hosted macOS
# instances. XcodeGen regenerates TrueFrame.xcodeproj from ios-trueframe/
# project.yml at build time, so no binary Xcode project is committed to git.
#
# Two workflows:
#   1. ios-simulator-build → fast .app compile + unit-test smoke test
#   2. ios-unsigned-ipa    → real .ipa archive, sideloadable / resignable,
#      posted as a downloadable Codemagic artifact.

workflows:

  ios-simulator-build:
    name: TrueFrame iOS — simulator build + tests (no Apple account needed)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: "ios-trueframe"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/trueframe-ios"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        script: |
          cd $XCODE_PROJECT_DIR
          xcodegen generate
          ls -la TrueFrame.xcodeproj/

      - name: Build & test for iOS Simulator
        script: |
          cd $XCODE_PROJECT_DIR
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          x=[v for devs in d['devices'].values() for v in devs if v.get('isAvailable') and 'iPhone' in v['name']]
          print(x[-1]['udid'])")
          xcodebuild test \
            -project TrueFrame.xcodeproj \
            -scheme TrueFrame \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty || exit 1

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: false
          failure: true

  # ---------------------------------------------------------------------
  # Device-ready UNSIGNED IPA. Wraps the archived .app into an .ipa that can be
  # installed on a real iPhone with a sideloading tool (AltStore / Sideloadly /
  # Signulous) or resigned with your own developer certificate.
  # ---------------------------------------------------------------------
  ios-unsigned-ipa:
    name: TrueFrame iOS — unsigned IPA (auto-built on every push)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT_DIR: "ios-trueframe"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/trueframe-ios"
          include: true
        - pattern: "main"
          include: true
        - pattern: "master"
          include: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd $XCODE_PROJECT_DIR
          xcodegen generate

      - name: Stamp build number from commit count
        script: |
          cd $XCODE_PROJECT_DIR
          BUILD_NUMBER=$(git rev-list HEAD --count)
          agvtool new-version -all $BUILD_NUMBER || true

      - name: Archive (unsigned, for sideloading or external resigning)
        script: |
          cd $XCODE_PROJECT_DIR
          xcodebuild archive \
            -project TrueFrame.xcodeproj \
            -scheme TrueFrame \
            -configuration Release \
            -archivePath build/TrueFrame.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit 1

      - name: Wrap .app into unsigned .ipa
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR/build"

          APP_PATH="TrueFrame.xcarchive/Products/Applications/TrueFrame.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Missing app bundle: $APP_PATH"
            find . -maxdepth 5 -type d -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          SHORT_SHA=$(git -C "$CM_BUILD_DIR" rev-parse --short HEAD)
          IPA_NAME="TrueFrame-${SHORT_SHA}-unsigned.ipa"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          cp "$IPA_NAME" TrueFrame-unsigned.ipa

          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$IPA_NAME" "$CM_BUILD_DIR/artifacts/"
          cp TrueFrame-unsigned.ipa "$CM_BUILD_DIR/artifacts/"

          echo "✅ IPA files ready:"
          ls -lh "$CM_BUILD_DIR/artifacts"/*.ipa
          rm -rf Payload

    artifacts:
      - artifacts/*.ipa
      - ios-trueframe/build/TrueFrame.xcarchive

    publishing:
      email:
        recipients:
          - ubdallahalrashdee@gmail.com
        notify:
          success: true
          failure: true
