name: iDiagnostics

options:
  bundleIdPrefix: com.bellinghamfolks.idiagnostics
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "200"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

targets:
  iDiagnostics:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bellinghamfolks.idiagnostics
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "iDiagnostics"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations:
          - ar
          - en
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "يستخدم iDiagnostics الكاميرا أثناء فحص تختاره أنت، ولا يحفظ الصور أو يرسلها."
        NSMicrophoneUsageDescription: "يستخدم iDiagnostics الميكروفون لتسجيل عينة قصيرة وتشغيلها محليًا، ثم يحذفها."
        NSLocationWhenInUseUsageDescription: "يستخدم iDiagnostics قراءة موقع واحدة عند طلبك للتحقق من استجابة GPS، ولا يحتفظ بالموقع."
        NSBluetoothAlwaysUsageDescription: "يستخدم iDiagnostics البلوتوث لقراءة حالة العتاد فقط أثناء فحص الاتصالات."
        NSFaceIDUsageDescription: "يستخدم iDiagnostics المصادقة المحلية للتحقق من استجابة Face ID دون الوصول إلى بيانات الوجه."
        NSMotionUsageDescription: "يستخدم iDiagnostics مستشعرات الحركة أثناء الفحص فقط للتحقق من استجابتها."

  iDiagnosticsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: iDiagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bellinghamfolks.idiagnostics.tests
        GENERATE_INFOPLIST_FILE: YES

  iDiagnosticsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: iDiagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bellinghamfolks.idiagnostics.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iDiagnostics

schemes:
  iDiagnostics:
    build:
      targets:
        iDiagnostics: all
        iDiagnosticsTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: iDiagnosticsTests
          parallelizable: true
        - name: iDiagnosticsUITests
          parallelizable: false
