name: TrueFrame
# TrueFrame — an accessible camera + non-generative photo-straightening app for
# blind and low-vision photographers. The correction engine only performs
# deterministic geometric operations (rotate / perspective / crop): it corrects
# the camera geometry, it never rewrites the scene.
options:
  bundleIdPrefix: com.trueframe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    INFOPLIST_KEY_CFBundleDisplayName: TrueFrame
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_NSCameraUsageDescription: TrueFrame uses the camera to guide framing and leveling and to capture your photo. Frames are analyzed on-device.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: TrueFrame imports photos so you can straighten them, and saves corrected copies.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: TrueFrame saves your corrected photo as a new copy; it never overwrites the original.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: TrueFrame uses the microphone only for optional spoken commands, processed on-device.
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: TrueFrame uses speech recognition on-device for optional spoken commands like "take photo" or "is it level".
targets:
  TrueFrame:
    type: application
    platform: iOS
    sources:
      - path: TrueFrame
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trueframe.app
        INFOPLIST_FILE: TrueFrame/Info.plist
    scheme:
      testTargets:
        - TrueFrameTests
  TrueFrameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrueFrameTests
    dependencies:
      - target: TrueFrame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trueframe.tests
