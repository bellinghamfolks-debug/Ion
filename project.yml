name: CoffeeAccess
options:
  bundleIdPrefix: com.coffeeaccess
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  CoffeeAccess:
    type: application
    platform: iOS
    sources:
      - path: CoffeeAccess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeaccess.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: قهوتي
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: نستخدم البلوتوث للاتصال بماكينة القهوة ومعرفة حالتها وتحضير مشروباتك.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: نستخدم الشبكة المحلية للبحث عن ماكينة القهوة في منزلك أثناء فحص الاتصال.
        INFOPLIST_KEY_NSSiriUsageDescription: نستخدم Siri لتحضير مشروبك ومعرفة حالة الماكينة بصوتك.
    scheme:
      testTargets:
        - CoffeeAccessTests
  CoffeeAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoffeeAccessTests
    dependencies:
      - target: CoffeeAccess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeaccess.tests
        GENERATE_INFOPLIST_FILE: YES
