name: CoffeeAccess
options:
  bundleIdPrefix: com.coffeeaccess
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 3.0.0
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  CoffeeAccess:
    type: application
    platform: iOS
    sources:
      - path: CoffeeAccess
      - path: Shared
    dependencies:
      - target: CoffeeWidgets
        embed: true
      - target: CoffeeWatch
    entitlements:
      path: Config/CoffeeAccess.entitlements
      properties:
        com.apple.security.application-groups: [group.com.coffeeaccess.app]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.coffeeaccess.app
    info:
      path: Config/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.coffeeaccess.links
            CFBundleURLSchemes: [coffeeaccess]
        NSHealthUpdateUsageDescription: يكتب قهوتي تقدير الكافيين في كل مشروب إلى تطبيق «صحتي» عندما تفعّل ذلك.
        NSHealthShareUsageDescription: لا يقرأ قهوتي أي بيانات صحية؛ يكتب تقدير الكافيين فقط عندما تفعّل ذلك.
        NSRemindersFullAccessUsageDescription: يضيف قهوتي قائمة مشترياتك (مزيل الترسبات والفلتر والبن) إلى «التذكيرات» عندما تطلب ذلك.
        NSLocationWhenInUseUsageDescription: يحدد قهوتي الماكينة الأقرب إليك (المنزل أو المكتب) عند فتح التطبيق، فقط إذا فعّلت ذلك. لا يُحفظ موقعك إلا مكانًا لكل ماكينة على جهازك.
        NSPhotoLibraryUsageDescription: يقرأ قهوتي صورة تختارها (كيس البن أو شاشة الماكينة) على جهازك فقط.
        NSFaceIDUsageDescription: يستخدم قهوتي بصمة الوجه لقفل الإعدادات عندما تفعّل ذلك.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeaccess.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: قهوتي
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: نستخدم البلوتوث للاتصال بماكينة القهوة ومعرفة حالتها وتحضير مشروباتك.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: نستخدم الشبكة المحلية للبحث عن ماكينة القهوة في منزلك أثناء فحص الاتصال.
        INFOPLIST_KEY_NSCameraUsageDescription: نستخدم الكاميرا لقراءة شاشة ماكينة القهوة بصوت عالٍ. تُقرأ الصورة على جهازك ولا تُرفع.
        INFOPLIST_KEY_NSSiriUsageDescription: نستخدم Siri لتحضير مشروبك ومعرفة حالة الماكينة بصوتك.
    scheme:
      testTargets:
        - CoffeeAccessTests
  CoffeeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CoffeeWidgets
        excludes: [Info.plist]
      - path: Shared
    entitlements:
      path: Config/CoffeeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.coffeeaccess.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeaccess.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CoffeeWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COFFEE_WIDGET"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  CoffeeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CoffeeWatch
    dependencies:
      - target: CoffeeWatchWidgets
        embed: true
    entitlements:
      path: Config/CoffeeWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.coffeeaccess.app]
    info:
      path: Config/CoffeeWatch-Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.coffeeaccess.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeaccess.app.watchkitapp
        PRODUCT_NAME: CoffeeWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: قهوتي
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.coffeeaccess.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  CoffeeWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CoffeeWatchWidgets
        excludes: [Info.plist]
    entitlements:
      path: Config/CoffeeWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.coffeeaccess.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeaccess.app.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CoffeeWatchWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  CoffeeAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoffeeAccessTests
    dependencies:
      - target: CoffeeAccess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coffeeaccess.tests
        GENERATE_INFOPLIST_FILE: YES
